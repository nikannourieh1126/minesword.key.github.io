name: Update FX Rates

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:         # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest USD/EUR rates
        env:
          NERKH_API_KEY: ${{ secrets.NERKH_API_KEY }}
        run: |
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o response.json "https://api.nerkh.io/v1/prices/json/currency?x-api-key=$NERKH_API_KEY")
          echo "HTTP status code: $HTTP_CODE"
          echo "----- raw response body -----"
          cat response.json
          echo ""
          echo "------------------------------"

          USD=$(jq -r '.data.prices.USD.current // empty' response.json)
          EUR=$(jq -r '.data.prices.EUR.current // empty' response.json)
          echo "Parsed USD: '$USD'"
          echo "Parsed EUR: '$EUR'"

          if [ -z "$USD" ] || [ -z "$EUR" ]; then
            echo "::error::Could not parse USD/EUR from the response — see raw body above. Keeping the previous rates.json untouched."
            exit 1
          fi

          DATE=$(date -u +%Y-%m-%d)
          echo "{\"usd\": $USD, \"eur\": $EUR, \"date\": \"$DATE\"}" > rates.json
          cat rates.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git diff --staged --quiet || git commit -m "Update FX rates"
          git push
